services:
  - type: web
    name: nexahr-backend
    env: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma
      - key: SQLITE_DB_PATH
        value: ./data/agent_state.db
      - key: PYTHON_VERSION
        value: 3.11.0
