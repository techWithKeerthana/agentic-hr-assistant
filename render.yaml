services:
  - type: web
    name: nexahr-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexahr-db
          property: connectionString
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/data/chroma
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: nexahr-db
    databaseName: nexahr
    user: nexahr
    plan: free
